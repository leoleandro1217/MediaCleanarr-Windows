name: Windows .NET build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify C# entry point exists
        shell: pwsh
        run: |
          if (!(Test-Path 'src/MediaCleanarr.Windows/Program.cs')) { throw 'Program.cs missing from checked-out commit' }
          if (!(Select-String -Path 'src/MediaCleanarr.Windows/Program.cs' -Pattern 'static void Main\(' -Quiet)) { throw 'Main entry point missing' }
          git log -1 --oneline
      - name: Publish standalone x64 Windows executable
        run: dotnet publish src/MediaCleanarr.Windows/MediaCleanarr.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaCleanarr-Windows-win-x64
          path: publish/MediaCleanarr-Windows.exe
      - name: Publish .NET alpha prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.2.0-alpha.2'
          $file = 'publish/MediaCleanarr-Windows.exe'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --title 'MediaCleanarr Windows v0.2.0 Alpha 2 (.NET)' --notes 'Windows native .NET 10 self-contained x64 prototype. Read-only library scanning, filtering, CSV export. No Python or Qt required.' --prerelease --target "${{ github.sha }}"
          }
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "publish/MediaCleanarr-Windows.exe" --generate-notes --verify-tag
