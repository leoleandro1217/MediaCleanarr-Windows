name: Windows .NET build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not let two overlapping builds mutate the same release simultaneously.
concurrency:
  group: mediacleanarr-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify entry point
        shell: pwsh
        run: |
          if (!(Test-Path 'src/MediaCleanarr.Windows/Program.cs')) { throw 'Program.cs missing' }
          if (!(Select-String -Path 'src/MediaCleanarr.Windows/Program.cs' -Pattern 'static void Main\(' -Quiet)) { throw 'Main entry point missing' }
      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish src/MediaCleanarr.Windows/MediaCleanarr.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
          if (!(Test-Path 'publish/MediaCleanarr-Windows.exe')) { throw 'EXE not produced' }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaCleanarr-Windows-win-x64
          path: publish/MediaCleanarr-Windows.exe
          if-no-files-found: error
      - name: Publish Alpha 7 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.7
          target_commitish: ${{ github.sha }}
          name: MediaCleanarr Windows v0.2.0 Alpha 7 (.NET)
          body: |
            Windows x64 portable, self-contained .NET 10 build.
            TMDb primary with original/French/English titles and year, optional OMDb and TheTVDB, local SQLite metadata cache, CSV export and custom icon.
            Read-only alpha: does not rename, move or delete files.
          prerelease: true
          make_latest: false
          files: publish/MediaCleanarr-Windows.exe
          fail_on_unmatched_files: true
