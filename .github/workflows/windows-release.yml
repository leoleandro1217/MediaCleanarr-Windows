name: Windows build and alpha release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0
      - name: Check source syntax
        run: python -m compileall -q main.py
      - name: Build portable Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaCleanarr-Windows main.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaCleanarr-Windows
          path: dist/MediaCleanarr-Windows.exe
      - name: Publish alpha release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.1.0-alpha.1"
          $file = "dist/MediaCleanarr-Windows.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --title "MediaCleanarr Windows v0.1.0 Alpha 1" --notes "Early read-only Windows build: folder selection, recursive video inventory, filename parsing, filtering and CSV export. Metadata, C411 integration and renaming are not available yet." --prerelease --target "${{ github.sha }}"
          }
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist/MediaCleanarr-Windows.exe" --generate-notes --verify-tag
